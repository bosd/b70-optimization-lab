name: guides-and-packages

on:
  pull_request:
    paths:
      - ".github/workflows/guides.yml"
      - "families/**"
      - "models/*.html"
      - "community/**"
      - "data/**"
      - "experiments/**"
      - "model-intake/**"
      - "patches/**"
      - "packages/**"
      - "repro/**"
      - "results/**"
      - "README.md"
      - "index.html"
      - "guides.html"
      - "learn.html"
      - "learn/**"
      - "tools/build-family-pages.py"
      - "tools/build-model-pages.py"
      - "tools/test_build_family_pages.py"
      - "tools/test_measured_opt_contract.py"
      - "tools/validate-repro-guides.py"
      - "tools/test_validate_repro_guides.py"
      - "tools/validate-recipe-publication.py"
      - "tools/test_validate_recipe_publication.py"
      - "tools/sync-depth-sweep-profiles.py"
      - "tools/test_sync_depth_sweep_profiles.py"
      - "tools/sync-public-result-summary.py"
      - "tools/test_sync_public_result_summary.py"
      - "tools/check-doc-links.py"
      - "tools/check-container-packet.py"
      - "tools/test_check_container_packet.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/guides.yml"
      - "families/**"
      - "models/*.html"
      - "community/**"
      - "data/**"
      - "experiments/**"
      - "model-intake/**"
      - "patches/**"
      - "packages/**"
      - "repro/**"
      - "results/**"
      - "README.md"
      - "index.html"
      - "guides.html"
      - "learn.html"
      - "learn/**"
      - "tools/build-family-pages.py"
      - "tools/build-model-pages.py"
      - "tools/test_build_family_pages.py"
      - "tools/test_measured_opt_contract.py"
      - "tools/validate-repro-guides.py"
      - "tools/test_validate_repro_guides.py"
      - "tools/validate-recipe-publication.py"
      - "tools/test_validate_recipe_publication.py"
      - "tools/sync-depth-sweep-profiles.py"
      - "tools/test_sync_depth_sweep_profiles.py"
      - "tools/sync-public-result-summary.py"
      - "tools/test_sync_public_result_summary.py"
      - "tools/check-doc-links.py"
      - "tools/check-container-packet.py"
      - "tools/test_check_container_packet.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/validate-repro-guides.py
      - run: python3 -m unittest tools/test_validate_repro_guides.py tools/test_sync_depth_sweep_profiles.py
      - run: python3 tools/validate-recipe-publication.py
      - run: python3 -m unittest tools/test_validate_recipe_publication.py
      - run: python3 tools/sync-public-result-summary.py --check
      - run: python3 -m unittest tools/test_sync_public_result_summary.py
      - run: python3 tools/build-family-pages.py --check
      - run: python3 -m unittest tools/test_build_family_pages.py
      - run: python3 -m unittest tools/test_measured_opt_contract.py
      - run: python3 tools/build-model-pages.py
      - run: git diff --exit-code -- index.html learn/hardware.html models
      # Offline: resolves repository-relative links in the guides and site pages. Publisher-side manifest checking
      # (tools/verify-model-manifests-remote.py) stays manual, since it needs the Hugging Face API and would flake here.
      - run: python3 tools/check-doc-links.py
      # Container packets are generated from the recipe launchers. This is the static half of that
      # guarantee: it needs neither the image nor the weights, so it runs here, while regenerating
      # (packages/*/scripts/render-compose.sh) needs both and stays on a lab host.
      - run: pip install --quiet pyyaml
      - run: python3 tools/check-container-packet.py
      - run: python3 -m unittest tools/test_check_container_packet.py
